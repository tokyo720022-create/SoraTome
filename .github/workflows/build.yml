name: Build debug APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Commits pushed by the unzip workflow do not trigger "push" workflows,
  # so build after that workflow finishes instead.
  workflow_run:
    workflows: ["Unzip and push"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # The signing key lives in GitHub secrets, never in the repository. Signing every build
      # with the same key lets a new build install over the old one without uninstalling.
      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SORATOME_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/soratome.keystore"
            echo "SORATOME_KEYSTORE_PATH=$RUNNER_TEMP/soratome.keystore" >> "$GITHUB_ENV"
            echo "Signing with the saved key."
          else
            echo "::warning::No signing key found in the repository secrets. This APK is signed with a temporary key, so it cannot be installed over an older build."
          fi

      - name: Build debug APK
        shell: bash
        env:
          SORATOME_KEYSTORE_PASSWORD: ${{ secrets.SORATOME_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log

      # On failure, copy the important lines into an annotation and the run
      # summary so the error is visible without scrolling through the log.
      - name: Summarize errors
        if: failure()
        shell: bash
        run: |
          {
            grep -E '^e: ' build.log | sort -u | head -n 10
            awk '/^\* What went wrong:/{f=1;next} /^\* Try:/{f=0} f' build.log | head -n 20
            grep -E '^Caused by: ' build.log | sort -u | head -n 5
          } > errors.txt || true
          [ -s errors.txt ] || tail -n 30 build.log > errors.txt
          msg=$(head -c 3500 errors.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Gradle build failed::${msg}"
          { echo '### Build errors'; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soratome-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
