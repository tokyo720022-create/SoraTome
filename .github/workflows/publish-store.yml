name: Publish plugin store

# Builds the plugin packages and index.json in plugin-repo/ from the plugins/ folder,
# and commits the result. See docs/PUBLISHING_A_STORE.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'tools/build_store.py'
  # Commits pushed by the unzip workflow do not trigger "push" workflows,
  # so also run after that workflow finishes.
  workflow_run:
    workflows: ["Unzip and push"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: publish-store
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the store
        shell: bash
        run: |
          if [ ! -d plugins ]; then
            echo "There is no plugins/ folder, nothing to publish."
            exit 0
          fi
          python3 tools/build_store.py

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A plugin-repo
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update plugin store"
          git push origin HEAD:main
