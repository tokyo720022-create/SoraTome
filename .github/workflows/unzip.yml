name: Unzip and push

# Drop a .zip in the repo root and push it to main.
# This workflow extracts it into the repo, deletes the zip, and commits the result.
# If the zip contains a DELETE.txt, the paths listed in it are removed first.

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unzip-and-push
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract zip files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          repo_name="${GITHUB_REPOSITORY#*/}"
          zips=(*.zip)

          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip files in the repo root. Nothing to do."
            exit 0
          fi

          for z in "${zips[@]}"; do
            echo "Extracting $z"
            tmp="$(mktemp -d)"
            unzip -q -o "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"

            # If the zip has a single top-level folder named after the repo, strip it
            src="$tmp"
            entries=("$tmp"/* "$tmp"/.[!.]*)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              name="$(basename "${entries[0]}")"
              if [ "${name,,}" = "${repo_name,,}" ]; then
                src="${entries[0]}"
              fi
            fi

            # Never copy git internals, macOS junk, or workflow files
            # (the default GITHUB_TOKEN is not allowed to modify .github/workflows)
            rm -rf "$src/.git" "$src/.github/workflows"

            # Optional DELETE.txt: one repo-relative path per line (blank lines and # comments are ignored).
            # Used when files are moved or renamed. Deletions run before the new files are copied in.
            if [ -f "$src/DELETE.txt" ]; then
              while IFS= read -r path || [ -n "$path" ]; do
                path="${path%$'\r'}"
                case "$path" in
                  ''|'#'*) continue ;;
                  .|./|/*|*..*|.git|.git/*|.github|.github/*)
                    echo "Skipping unsafe path: $path"
                    continue
                    ;;
                esac
                if [ -e "$path" ]; then
                  rm -rf -- "$path"
                  echo "Deleted: $path"
                else
                  echo "Already gone: $path"
                fi
              done < "$src/DELETE.txt"
              rm -f "$src/DELETE.txt"
            fi

            cp -a "$src"/. .
            git rm -q -f -- "$z"
            rm -rf "$tmp"
          done

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: unzip uploaded archive"
          git push origin HEAD:main